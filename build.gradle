import org.panteleyev.jpackage.ImageType

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.panteleyev.jpackageplugin' version '1.6.0'
}

def versionFile = file('version.txt')
def defaultVersion = '0.1.14'
def currentVersion = versionFile.exists() ? versionFile.text.trim() : defaultVersion
if (!versionFile.exists()) {
    versionFile.text = currentVersion
}

def versionParts = currentVersion.split('\\.')
while (versionParts.length < 3) {
    currentVersion += ".0"
    versionParts = currentVersion.split('\\.')
}
def nextVersion = "${versionParts[0]}.${versionParts[1]}.${(versionParts[2] as int) + 1}"

group = 'ru.vit4liy'
version = currentVersion

repositories {
    mavenCentral()
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}

dependencies {
    implementation files('libs/config-lib-1.3.1.jar')
    implementation files('libs/logger-lib-1.3.2.jar')
    implementation files('libs/module-lib-1.2.9.jar')
    implementation files('libs/rsc-lib-1.4.3.jar')
    implementation files('libs/web-lib-1.0.jar')
    implementation files('libs/perm-lib-1.3.1.jar')
    implementation files('libs/events-lib-1.1.jar')

    implementation("org.slf4j:slf4j-simple:2.0.13")
    implementation("io.javalin:javalin:6.7.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.2")
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.46.0.0'
}

application {
    mainClass = 'ru.vit4liy.Launcher'
}

tasks.register('generateVersionProperties') {
    doLast {
        def propsFile = file("$buildDir/resources/main/app.properties")
        propsFile.parentFile.mkdirs()
        propsFile.text = "app.version=${currentVersion}\nbuild.date=${new Date().format('yyyy-MM-dd HH:mm:ss')}\n"
    }
}
processResources.dependsOn generateVersionProperties

jar {
    manifest {
        attributes 'Main-Class': 'ru.vit4liy.Launcher'
    }
}

tasks.register('coreJar', Jar) {
    archiveClassifier.set('core')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    configurations.runtimeClasspath.each { File file ->
        if (file.name.endsWith('.jar')) {
            from(zipTree(file)) {
                exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
                exclude 'META-INF/MANIFEST.MF'
                exclude 'META-INF/maven/**'
                exclude 'module-info.class'
            }
        }
    }

    from(sourceSets.main.output) {
        include 'ru/vit4liy/base/**'
    }

    manifest {
        attributes 'Main-Class': 'ru.vit4liy.Launcher'
    }
}

tasks.register('serverJar', Jar) {
    archiveClassifier.set('server')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    configurations.runtimeClasspath.each { File file ->
        if (file.name.endsWith('.jar')) {
            from(zipTree(file)) {
                exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
                exclude 'META-INF/MANIFEST.MF'
                exclude 'META-INF/maven/**'
                exclude 'module-info.class'
            }
        }
    }

    from(sourceSets.main.output) {
        include 'ru/vit4liy/backend/**'
    }

    manifest {
        attributes 'Main-Class': 'ru.vit4liy.Launcher'
    }
}

assemble.dependsOn coreJar, serverJar

tasks.register('copyDeps', Copy) {
    dependsOn jar
    from configurations.runtimeClasspath
    from jar.archiveFile
    into "$buildDir/deps"
}

def osName = System.getProperty("os.name").toLowerCase()
def isWindows = osName.contains("win")
def isLinux = osName.contains("linux")
def isMac = osName.contains("mac")

jpackage {
    dependsOn copyDeps

    appName = "ITHelper"
    appVersion = project.version.toString()
    vendor = "ru.vit4liy"
    destination = "$buildDir/distributions"

    input = "$buildDir/deps"
    mainJar = jar.archiveFileName.get()
    mainClass = "ru.vit4liy.Launcher"

    // fileAssociations = ["package/windows/file.associations"] // Закомментировано, чтобы не ломать сборку, если файла нет
    verbose = true

    if (isWindows) {
        type = ImageType.EXE
        // icon = "package/windows/invc.ico" // Закомментировано, чтобы не ломать сборку, если файла нет
        winMenu = true
        winShortcut = true
        winConsole = false
        winDirChooser = true
        winPerUserInstall = true
    } else if (isLinux) {
        type = ImageType.RPM
        icon = "package/linux/invc.png"
        linuxPackageName = "ithelper"
        linuxShortcut = true
        linuxMenuGroup = "Utility"
    } else if (isMac) {
        type = ImageType.DMG
        icon = "package/macos/invc.icns"
        macPackageName = "ITHelper"
    } else {
        throw new GradleException("Неподдерживаемая ОС для сборки jpackage: ${osName}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

tasks.named('jpackage') {
    doLast {
        versionFile.text = nextVersion
        println "=========================================="
        println "✅ Installer created successfully!"
        println "📁 Directory: ${buildDir}/distributions"
        println "✅ Также созданы: ${buildDir}/libs/*-core.jar и *-server.jar"
        println "=========================================="
    }
}

tasks.withType(JavaExec) {
    systemProperty "file.encoding", "UTF-8"
}